<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="fastlinkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Lightning bolt icon -->
  <path d="M20 10 L35 10 L25 30 L40 30 L20 50 L30 32 L20 32 Z" fill="url(#fastlinkGradient)" stroke="#fff" stroke-width="1"/>
  
  <!-- FASTLINK text -->
  <text x="50" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">FAST</text>
  <text x="50" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#fastlinkGradient)">LINK</text>
  
  <!-- Tagline -->
  <text x="130" y="35" font-family="Arial, sans-serif" font-size="10" fill="#ccc">High-Speed Internet</text>
</svg>